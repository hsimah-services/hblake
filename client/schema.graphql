schema {
  query: RootQuery
  mutation: RootMutation
}

type RootQuery {
  "One Page by id."
  page(id: ID!): Page

  "One PageItem by id."
  pageItem(id: ID!): PageItem

  "Look up one content record by exact canonical slug under read policies."
  pageBySlug(slug: String!): Page

  "Look up one item by exact canonical slug under read policies."
  pageItemBySlug(slug: String!): PageItem

  pages(first: Int, after: String, last: Int, before: String): RootQueryToPageConnection
  pageItems(first: Int, after: String, last: Int, before: String): RootQueryToPageItemConnection
  pageItemsOfPage(first: Int, after: String, last: Int, before: String, where: RootQueryToPageItemsOfPageConnectionWhereArgs): RootQueryToPageItemsOfPageConnection
  placedPages(first: Int, after: String, last: Int, before: String, where: RootQueryToPlacedPagesConnectionWhereArgs): RootQueryToPlacedPagesConnection
  recentPageItems(first: Int, after: String, last: Int, before: String, where: RootQueryToRecentPageItemsConnectionWhereArgs): RootQueryToRecentPageItemsConnection
  recentPages(first: Int, after: String, last: Int, before: String, where: RootQueryToRecentPagesConnectionWhereArgs): RootQueryToRecentPagesConnection
  node(id: ID!): Node
  viewer: Viewer
  adminUser(id: ID!): AdminUser
}

interface Node {
  id: ID!
}

enum PublicationStatus {
  DRAFT
  PUBLISHED
}

enum PageAccent {
  INK
  GREEN
  ORANGE
  BLUE
  BERRY
}

enum UserRole {
  EDITOR
  ADMIN
}

type RootMutation {
  createPage(input: CreatePageInput!): CreatePagePayload
  createPageItem(input: CreatePageItemInput!): CreatePageItemPayload
  deletePage(input: DeletePageInput!): DeletePagePayload
  deletePageItem(input: DeletePageItemInput!): DeletePageItemPayload
  publishPage(input: PublishPageInput!): PublishPagePayload
  publishPageItem(input: PublishPageItemInput!): PublishPageItemPayload
  unpublishPage(input: UnpublishPageInput!): UnpublishPagePayload
  unpublishPageItem(input: UnpublishPageItemInput!): UnpublishPageItemPayload
  updatePage(input: UpdatePageInput!): UpdatePagePayload
  updatePageItem(input: UpdatePageItemInput!): UpdatePageItemPayload
  updateAdminUser(input: UpdateAdminUserInput!): UpdateAdminUserPayload
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Author {
  displayName: String!
}

"Durable consulting page."
type Page implements Node {
  "The globally unique identifier, opaque and safe to use as a cache key."
  id: ID!

  ""
  title: String!

  ""
  slug: String!

  ""
  content: String!

  ""
  excerpt: String!

  ""
  status: PublicationStatus!

  ""
  publishedAt: String

  ""
  createdAt: String!

  ""
  updatedAt: String!

  ""
  defaultItemKind: String

  ""
  showInNavigation: Boolean!

  ""
  navigationOrder: Int!

  ""
  featureOnHome: Boolean!

  ""
  homeOrder: Int!

  ""
  accent: PageAccent!

  itemCount: Int!
  publishedItemCount: Int!
  author: Author
  items(first: Int, after: String, last: Int, before: String): PageToPageItemConnection
}

"Item attached to a page, such as a news article, product or framework entry, grouped by kind."
type PageItem implements Node {
  "The globally unique identifier, opaque and safe to use as a cache key."
  id: ID!

  ""
  title: String!

  ""
  slug: String!

  ""
  content: String!

  ""
  excerpt: String!

  ""
  status: PublicationStatus!

  ""
  publishedAt: String

  ""
  createdAt: String!

  ""
  updatedAt: String!

  ""
  kind: String!

  ""
  enquiryUrl: String

  "The page this item belongs to."
  page: Page

  author: Author
}

type PageToPageItemConnectionEdge {
  cursor: String
  node: PageItem
}

type PageToPageItemConnection {
  nodes: [PageItem]
  edges: [PageToPageItemConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

type RootQueryToPageConnectionEdge {
  cursor: String
  node: Page
}

type RootQueryToPageConnection {
  nodes: [Page]
  edges: [RootQueryToPageConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

type RootQueryToPageItemConnectionEdge {
  cursor: String
  node: PageItem
}

type RootQueryToPageItemConnection {
  nodes: [PageItem]
  edges: [RootQueryToPageItemConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

type RootQueryToPageItemsOfPageConnectionEdge {
  cursor: String
  node: PageItem
}

type RootQueryToPageItemsOfPageConnection {
  nodes: [PageItem]
  edges: [RootQueryToPageItemsOfPageConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

input RootQueryToPageItemsOfPageConnectionWhereArgs {
  page: String!
}

type RootQueryToPlacedPagesConnectionEdge {
  cursor: String
  node: Page
}

type RootQueryToPlacedPagesConnection {
  nodes: [Page]
  edges: [RootQueryToPlacedPagesConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

input RootQueryToPlacedPagesConnectionWhereArgs {
  home: Boolean!
}

type RootQueryToRecentPageItemsConnectionEdge {
  cursor: String
  node: PageItem
}

type RootQueryToRecentPageItemsConnection {
  nodes: [PageItem]
  edges: [RootQueryToRecentPageItemsConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

input RootQueryToRecentPageItemsConnectionWhereArgs {
  kind: String
  status: PublicationStatus
}

type RootQueryToRecentPagesConnectionEdge {
  cursor: String
  node: Page
}

type RootQueryToRecentPagesConnection {
  nodes: [Page]
  edges: [RootQueryToRecentPagesConnectionEdge]
  pageInfo: PageInfo!

  "How many match, ignoring pagination."
  totalCount: Int
}

input RootQueryToRecentPagesConnectionWhereArgs {
  status: PublicationStatus
}

input CreatePageInput {
  title: String!
  slug: String!
  content: String
  excerpt: String
  status: PublicationStatus
  publishedAt: String
  defaultItemKind: String
  showInNavigation: Boolean
  navigationOrder: Int
  featureOnHome: Boolean
  homeOrder: Int
  accent: PageAccent
  clientMutationId: String
}

type CreatePagePayload {
  page: Page
  clientMutationId: String
}

input CreatePageItemInput {
  title: String!
  slug: String!
  content: String
  excerpt: String
  status: PublicationStatus
  publishedAt: String
  kind: String
  enquiryUrl: String
  page: ID
  clientMutationId: String
}

type CreatePageItemPayload {
  pageItem: PageItem
  clientMutationId: String
}

input DeletePageInput {
  id: ID!
  clientMutationId: String
}

type DeletePagePayload {
  deletedId: ID
  clientMutationId: String
}

input DeletePageItemInput {
  id: ID!
  clientMutationId: String
}

type DeletePageItemPayload {
  deletedId: ID
  clientMutationId: String
}

input PublishPageInput {
  id: ID!
  clientMutationId: String
}

type PublishPagePayload {
  page: Page
  clientMutationId: String
}

input PublishPageItemInput {
  id: ID!
  clientMutationId: String
}

type PublishPageItemPayload {
  pageItem: PageItem
  clientMutationId: String
}

input UnpublishPageInput {
  id: ID!
  clientMutationId: String
}

type UnpublishPagePayload {
  page: Page
  clientMutationId: String
}

input UnpublishPageItemInput {
  id: ID!
  clientMutationId: String
}

type UnpublishPageItemPayload {
  pageItem: PageItem
  clientMutationId: String
}

input UpdatePageInput {
  id: ID!
  title: String
  slug: String
  content: String
  excerpt: String
  status: PublicationStatus
  publishedAt: String
  defaultItemKind: String
  showInNavigation: Boolean
  navigationOrder: Int
  featureOnHome: Boolean
  homeOrder: Int
  accent: PageAccent
  clientMutationId: String
}

type UpdatePagePayload {
  page: Page
  clientMutationId: String
}

input UpdatePageItemInput {
  id: ID!
  title: String
  slug: String
  content: String
  excerpt: String
  status: PublicationStatus
  publishedAt: String
  kind: String
  enquiryUrl: String
  page: ID
  clientMutationId: String
}

type UpdatePageItemPayload {
  pageItem: PageItem
  clientMutationId: String
}

type Viewer {
  id: ID
  displayName: String
  role: UserRole
}

type AdminUser {
  id: ID!
  username: String
  displayName: String
}

input UpdateAdminUserInput {
  id: ID!
  displayName: String
  clientMutationId: String
}

type UpdateAdminUserPayload {
  adminUser: AdminUser
  clientMutationId: String
}
