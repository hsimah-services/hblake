# Proposed application UI contract. tsquid does not currently consume this file.
version: 1
renderer: astryx
entities:
  Page:
    source: graphql
    list: [title, slug, status, updatedAt]
    detail: [title, slug, content, excerpt, status, publishedAt, createdAt, updatedAt]
    create: [title, slug, content, excerpt, showInNavigation, navigationOrder, featureOnHome, homeOrder, accent, defaultItemKind]
    edit: [title, slug, content, excerpt, showInNavigation, navigationOrder, featureOnHome, homeOrder, accent, defaultItemKind]
    actions: [publish, unpublish, delete]
  PageItem:
    source: graphql
    list: [title, slug, status, publishedAt, updatedAt]
    detail: [title, slug, content, excerpt, kind, enquiryUrl, author, status, publishedAt, createdAt, updatedAt]
    create: [title, slug, content, excerpt, enquiryUrl, kind]
    edit: [title, slug, content, excerpt, enquiryUrl, kind]
    actions: [publish, unpublish, delete]
  User:
    source: privateAdminDto
    detail: [username, displayName]
    edit: [displayName]
    actions: []
