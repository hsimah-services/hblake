entity: Page
description: Durable consulting page.
use: [Content, Publishable, Timestamps]
integrations:
  graphql:
    singular: Page
    plural: Pages
storage:
  table: page
policies:
  terminalRule:
    read: deny
    write: deny
queries:
  bySlug:
    description: Look up one content record by exact canonical slug under read policies.
    args:
      slug: { type: string }
    returns:
      type: Page
      cardinality: one
    integrations:
      graphql:
        field: pageBySlug
    handler: true
