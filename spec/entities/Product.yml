entity: Product
description: Software product or consulting offering.
use: [Content, Publishable, Timestamps]
integrations:
  graphql:
    singular: Product
    plural: Products
storage:
  table: product
policies:
  terminalRule:
    read: deny
    write: deny
fields:
  enquiryUrl:
    type: string
    nullable: true
    maxLength: 2048
    verify: true
queries:
  bySlug:
    description: Look up one content record by exact canonical slug under read policies.
    args:
      slug: { type: string }
    returns:
      type: Product
      cardinality: one
    integrations:
      graphql:
        field: productBySlug
    handler: true
